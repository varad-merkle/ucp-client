[project]
name = "ucp-client"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "openai>=3.24.0",
    "pyngrok>=8.1.2",
    "python-dotenv>=1.2.3",
    "ucp-sdk>=0.5.0",
    "uvicorn>=0.52.4",
]


[tool.sonar]
projectKey = "UCP_MCP"
projectName = "UCP Client (backend)"
sources = "."
exclusions = ".venv/**,__pycache__/**,.scannerwork/**,.ruff_cache/**,.idea/**,.pytest_cache/**,tests/**,test.py,*.db"
tests = "tests"
python.coverage.reportPaths = "coverage.xml"
python.version = "3.11"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = [".venv/*", "tests/*", "test.py"]
